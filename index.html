<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Kitchen | Order Online</title>
    <style>
        :root {
            --primary: #e67e22;
            --primary-hover: #d35400;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--light); color: var(--dark); padding-bottom: 60px; }
        header { background: var(--white); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; padding: 15px 20px; }
        .nav-container { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary); }
        .cart-icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; gap: 5px; color: var(--dark); }
        .cart-badge { background: var(--primary); color: var(--white); font-size: 12px; padding: 2px 7px; border-radius: 20px; font-weight: bold; }
        .hero { text-align: center; padding: 40px 20px; max-width: 600px; margin: 0 auto; }
        .hero h1 { font-size: 32px; margin-bottom: 10px; color: var(--dark); }
        .hero p { color: #7f8c8d; font-size: 16px; }
        .main-container { max-width: 1000px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr; gap: 30px; }
        @media (min-width: 768px) { .main-container { grid-template-columns: 2fr 1fr; } }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 480px) { .menu-grid { grid-template-columns: 1fr 1fr; } }
        .menu-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
        .menu-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; gap: 15px; }
        .menu-title { font-size: 18px; font-weight: 700; }
        .menu-meta { display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 20px; font-weight: 800; color: var(--primary); }
        .btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-primary { background: var(--primary); color: var(--white); width: 100%; }
        .btn-primary:hover { background: var(--primary-hover); }
        .checkout-sidebar { background: var(--white); padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow); height: fit-content; position: sticky; top: 90px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; font-weight: 600; color: #7f8c8d; }
        input { width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 8px; font-size: 15px; outline: none; }
        input:focus { border-color: var(--primary); }
        .cart-summary-list { margin: 15px 0; border-top: 1px solid #eee; padding-top: 15px; }
        .cart-summary-item { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #7f8c8d; }
        .total-row { display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; border-top: 1px solid #eee; padding-top: 15px; margin-top: 15px; color: var(--dark); }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">🍔 Gourmet Kitchen</div>
            <button class="cart-icon-btn">🛒 Cart <span id="cart-badge" class="cart-badge">0</span></button>
        </div>
    </header>

    <section class="hero">
        <h1>Delicious Food, Delivered Fast</h1>
        <p>Browse our kitchen menu below and place your order securely in seconds.</p>
    </section>

    <main class="main-container">
        <section>
            <h2 style="margin-bottom: 20px;">🔥 Popular Items</h2>
            <div class="menu-grid">
                <div class="menu-card">
                    <div class="menu-info">
                        <div class="menu-title">Classic Beef Burger</div>
                        <div class="menu-meta">
                            <span class="price">R90</span>
                            <button class="btn btn-primary" onclick="addToCart('Classic Beef Burger', 90)" style="width: auto;">Add</button>
                        </div>
                    </div>
                </div>
                <div class="menu-card">
                    <div class="menu-info">
                        <div class="menu-title">Large Rustic Fries</div>
                        <div class="menu-meta">
                            <span class="price">R40</span>
                            <button class="btn btn-primary" onclick="addToCart('Large Rustic Fries', 40)" style="width: auto;">Add</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <aside class="checkout-sidebar">
            <h2 style="margin-bottom: 15px;">🛒 Secure Checkout</h2>
            <div class="form-group">
                <label for="customerName">Full Name</label>
                <input type="text" id="customerName" placeholder="e.g. Sipho Nkosi" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="e.g. 082 123 4567" required>
            </div>
            <div class="form-group">
                <label for="address">Delivery Address</label>
                <input type="text" id="address" placeholder="Street Address, Suburb" required>
            </div>
            <div class="cart-summary-list" id="cart-summary-list"></div>
            <div class="total-row">
                <span>Total:</span>
                <span id="total-price">R0</span>
            </div>
            <button class="btn btn-primary" onclick="submitOrder()" style="margin-top: 20px;">Place Order Now</button>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
