<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Food Ordering</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .menu-item { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .checkout-form { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
        button { padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        input { padding: 8px; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🍔 Kitchen Menu</h1>
    
    <div class="menu-item">
        <span><strong>Beef Burger</strong> - R90</span>
        <button onclick="addToCart('Beef Burger', 90)">Add to Cart</button>
    </div>
    <div class="menu-item">
        <span><strong>Large Fries</strong> - R40</span>
        <button onclick="addToCart('Large Fries', 40)">Add to Cart</button>
    </div>

    <h3>Your Cart Items: <span id="cart-count">0</span></h3>

    <div class="checkout-form">
        <h3>Delivery Details</h3>
        <input type="text" id="customerName" placeholder="Your Full Name" required>
        <input type="text" id="address" placeholder="Delivery Address" required>
        <input type="tel" id="phone" placeholder="Phone Number" required>
        <button onclick="submitOrder()">Place Order</button>
    </div>

    <!-- Link your backend javascript file -->
    <script src="app.js"></script>
</body>
</html>
